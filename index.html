<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>현장 전용 청중 투표</title>
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      text-align: center;
      padding: 20px;
      margin: 0;
      background-color: #f8f9fa;
    }
    .card {
      max-width: 500px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .status-icon { font-size: 48px; margin-bottom: 10px; }
    .btn {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 15px;
    }
    iframe {
      width: 100%;
      height: 700px;
      border: none;
      display: none;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="card" id="auth-box">
    <div class="status-icon">📍</div>
    <h2>현장 위치 확인 중</h2>
    <p id="message">투표 참여를 위해 현장 위치 확인이 필요합니다.<br>위치 정보 제공 권한을 허용해 주세요.</p>
    <button class="btn" onclick="checkLocation()">내 위치 확인하고 투표하기</button>
  </div>

  <!-- 투표 폼 (기본 상태는 숨김) -->
  <iframe id="vote-form" src="https://forms.gle/bkEzLnSRrP3QV4rJA"></iframe>

  <script>
    // ================= [설정 부분] =================
    const VENUE_LAT = 36.3806906;       // [수정] 행사장 위도
    const VENUE_LNG = 127.3237078;      // [수정] 행사장 경도
    const ALLOWED_RADIUS_METER = 150;  // [수정] 허용 반경 (미터 단위, 실내는 100~150m 추천)
    const FORM_URL = "https://forms.gle/bkEzLnSRrP3QV4rJA"; // [수정] 구글폼 또는 Tally 퍼가지 URL
    // ==============================================

    // 두 좌표 간 거리 계산 함수 (Haversine Formula)
    function getDistanceInMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3; // 지구 반지름 (m)
      const rad = Math.PI / 180;
      const dLat = (lat2 - lat1) * rad;
      const dLon = (lon2 - lon1) * rad;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * rad) * Math.cos(lat2 * rad) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function checkLocation() {
      const msg = document.getElementById("message");
      msg.innerText = "위치 정보를 가져오는 중입니다...";

      if (!navigator.geolocation) {
        msg.innerText = "이 브라우저는 위치 서비스를 지원하지 않습니다.";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const userLat = position.coords.latitude;
          const userLng = position.coords.longitude;
          
          const distance = getDistanceInMeters(VENUE_LAT, VENUE_LNG, userLat, userLng);

          if (distance <= ALLOWED_RADIUS_METER) {
            // 위치 인증 성공
            document.getElementById("auth-box").style.display = "none";
            const formIframe = document.getElementById("vote-form");
            formIframe.src = FORM_URL;
            formIframe.style.display = "block";
          } else {
            // 범위 밖
            msg.innerHTML = `<span style="color:red; font-weight:bold;">현장 범위를 벗어났습니다.</span><br>(현재 행사장과의 거리: 약 ${Math.round(distance)}m)<br>행사장 내부에서 다시 시도해 주세요.`;
          }
        },
        (error) => {
          // 위치 권한 거부 / 오류 발생 시
          msg.innerHTML = `<span style="color:red;">위치 확인에 실패했습니다.</span><br>브라우저 설정에서 위치 권한을 '허용'으로 변경한 뒤 다시 눌러주세요.`;
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    // 페이지 접속 시 자동 실행
    window.onload = checkLocation;
  </script>
</body>
</html>
